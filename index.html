<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="九州家庭遊"><meta name="application-name" content="九州家庭遊"><meta name="theme-color" content="#FFFCF6"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#FFFCF6;color:#3E3A39}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>九州家庭遊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：日系繪本風手機 App。頂端固定選單（今天／行程／地圖／景點美食／清單／資訊），和紙白底、墨灰粗框、平塗四色。刻意只做淺色一種外觀。 */
:root{
  --washi:#FFFCF6; --sumi:#3E3A39; --coral:#F2A497; --yama:#F6D27A; --mizu:#A8D3E6; --waka:#B9DAA5;
  --bg:var(--washi); --surface:var(--washi); --sunk:#F5EEE1; --line:#DCD2C3;
  --ink:var(--sumi); --muted:#6B6461; --teal:var(--sumi); --teal2:var(--sumi); --teal-soft:var(--mizu);
  --brick:#A3443A; --brick-soft:#FBE3DD; --apricot:var(--yama); --apricot-soft:#FCEFCB;
  --on-dark:var(--sumi);
  --display:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:74px 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;color:var(--teal)}
h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.25;color:var(--teal)}
h3{font-size:15px;font-weight:700;color:var(--teal)}
.sub{font-size:13px;color:var(--muted)}
.label{font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--brick)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.t{background:var(--teal);color:var(--on-dark)}
.pill.o{border:1.5px solid var(--brick-soft);color:var(--brick);background:var(--surface)}
.pill.a{background:var(--apricot-soft);color:var(--brick)}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.btn{font:inherit;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 12px;min-height:38px;
  border:1px solid var(--line);background:var(--surface);color:var(--teal);text-decoration:none;cursor:pointer}
.btn.p{background:var(--teal2);border-color:var(--teal2);color:var(--on-dark)}
.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 頁首：博多織條紋飾邊 */
.top{padding-bottom:12px;border-bottom:5px solid transparent;
  border-image:repeating-linear-gradient(90deg,var(--teal) 0 10px,transparent 10px 14px,var(--teal) 14px 16px,transparent 16px 20px,var(--brick) 20px 24px,transparent 24px 28px) 5}

/* 今天 */
.hero{background:var(--teal);color:var(--on-dark);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;margin-left:6px}
.hero .ttl{font-size:18px;font-weight:700}
.hero .meta{font-size:13px;opacity:.85}
.now{border:2px solid var(--brick);background:var(--brick-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.now .label{color:var(--brick)}
.now b{font-size:18px;color:var(--ink)}

/* 日期切換 */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.days::-webkit-scrollbar{display:none}
.days button{font:inherit;flex:0 0 auto;width:58px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.days button b{font-family:var(--display);font-weight:400;font-size:18px}
.days button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:#fff}
.days button[aria-pressed="true"] small{color:#fff;opacity:.85}
.days button.today::after{content:"今天";font-size:10px;font-weight:700;color:var(--brick);margin-top:1px}
.days button.today[aria-pressed="true"]::after{color:#fff}

/* 時間軸 */
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:18px;bottom:18px;border-left:2px dashed var(--line)}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:10px 0;position:relative;align-items:start}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal2);color:var(--on-dark);position:relative;z-index:1;font-weight:700;font-size:14px}
.dot svg{width:16px;height:16px}
.st.spot .dot{background:var(--brick);color:#fff}
.st.done{opacity:.55}
.st.cur .dot{box-shadow:0 0 0 5px var(--brick-soft)}
.st .tm{font-size:13px;font-weight:700;color:var(--brick);font-variant-numeric:tabular-nums}
.st .nm{font-size:16px;font-weight:700;color:var(--ink);line-height:1.35}
.st.move .nm{font-size:15px;color:var(--teal)}
.st .ds{font-size:13px;color:var(--muted)}
.st .row{margin-top:6px}
.badge{font-size:11px;font-weight:700;color:#fff;background:var(--brick);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.legs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13.5px}
.legs span:nth-child(2n){font-weight:700;color:var(--brick);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{display:flex;flex-direction:column;gap:6px;font-size:14px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.tips li::before{content:"✓";color:var(--teal2);font-weight:700}
.foods{display:flex;gap:6px;flex-wrap:wrap}
.hotel{background:var(--apricot-soft);border-color:transparent}
textarea{width:100%;min-height:96px;font:inherit;font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}

/* 美食 */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{font:inherit;font-size:13.5px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;min-height:36px}
.chips button small{color:var(--muted);margin-left:4px;font-size:11.5px}
.chips button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-dark)}
.chips button[aria-pressed="true"] small{color:var(--on-dark);opacity:.8}
.fd{display:flex;flex-direction:column;gap:4px}
.fd .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.fd .nm{font-weight:700;font-size:16px}
.fd .jp{font-size:12.5px;color:var(--muted)}
.fd p{margin:2px 0 4px;font-size:14px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.heart{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;min-width:44px;height:36px;cursor:pointer;font-size:16px;flex:none}
.heart[aria-pressed="true"]{color:var(--brick);border-color:var(--brick);background:var(--brick-soft)}
.cat{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.acts .btn{justify-content:center;padding:7px 4px;font-size:13px}
.btn.ph{background:var(--apricot-soft);border-color:transparent;color:var(--brick)}
@media (max-width:420px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plan{border:2px solid var(--teal2);background:var(--teal-soft)}
.src{font-size:11.5px;color:var(--muted);margin-top:-2px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 38px;min-height:44px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 清單 */
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal2);border-radius:99px;transition:width .3s}
.ck{display:flex;flex-direction:column}
.ck label{display:flex;gap:12px;align-items:center;min-height:44px;font-size:15px;cursor:pointer;border-bottom:1px dashed var(--line)}
.ck label:last-child{border-bottom:0}
.ck input{width:20px;height:20px;accent-color:var(--teal2);flex:none}
.ck input:checked+span:not(.ckt){color:var(--muted);text-decoration:line-through}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
.seg button b{font-size:14px;white-space:nowrap}
.seg button small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-dark)}
.seg button[aria-pressed="true"] small{color:var(--on-dark);opacity:.85}
.ckt{display:flex;flex-direction:column;padding-block:8px;min-width:0}
.ckt small{font-size:12.5px;color:var(--muted);line-height:1.4}
.ck input:checked+.ckt>span{color:var(--muted);text-decoration:line-through}
/* 資訊 */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:500}
.tbl tr.me td{color:var(--brick);font-weight:700}
.sel{user-select:all}

.where{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--on-dark);background:var(--brick);border-color:var(--brick);padding:16px 18px}
.where svg{width:34px;height:34px;flex:none}
.where b{display:block;font-size:19px}
.where small{font-size:13px;opacity:.9}
.btn.big{justify-content:flex-start;padding:10px 14px;text-align:left}
.btn.big span{display:flex;flex-direction:column;min-width:0}
.btn.big small{font-weight:400;font-size:12.5px;opacity:.9}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:s}
.stops li{display:grid;grid-template-columns:28px 76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;counter-increment:s}
.stops li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--brick);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.stops li span{font-size:12px;color:var(--brick);font-weight:700;font-variant-numeric:tabular-nums}
.stops li:last-child,.picks li:last-child{border-bottom:0}
.nearby{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nearby .btn{justify-content:center;padding:7px 2px;font-size:13px}
.picks{list-style:none;margin:0;padding:0}
.picks li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.pn{display:flex;flex-direction:column;min-width:0}
.pn small{font-size:12px;color:var(--muted)}
@media (max-width:420px){.stops li{grid-template-columns:28px minmax(0,1fr) auto}.stops li span{display:none}}
.chips button.off{border-style:dashed}
.offnote{font-size:13.5px;background:var(--apricot-soft);border-radius:12px;padding:10px 12px;line-height:1.5}
.offnote b{display:inline-block;background:var(--brick);color:#fff;font-size:11.5px;border-radius:6px;padding:0 6px;margin-right:6px}
.btn.offb{border-style:dashed}
.offc{border-style:dashed;border-width:1.5px}
.warnc{display:flex;flex-direction:column;gap:8px;border:2px solid var(--brick);background:var(--surface)}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14px;line-height:1.5}
.wt{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;margin-top:1px}
.wl li.err .wt{background:var(--brick);color:#fff}
.wl li.warn .wt{background:var(--apricot-soft);color:var(--brick);border:1px solid var(--apricot)}
.wl li.chk .wt{background:var(--teal-soft);color:var(--teal)}
.days button{position:relative}
.wd{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brick);border:1.5px solid var(--surface)}
.st .wl{margin-top:8px;background:var(--brick-soft);border-radius:10px;padding:8px 10px;gap:6px}
.st .wl li{font-size:13px}
.wsum{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wt.e{background:var(--brick);color:#fff}.wt.w{background:var(--apricot-soft);color:var(--brick);border:1px solid var(--apricot)}.wt.c{background:var(--teal-soft);color:var(--teal)}
.tix{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tk{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--apricot-soft);border:1px dashed var(--apricot);border-radius:10px;padding:8px 10px;min-height:44px}
.tk svg{width:20px;height:20px;color:var(--brick);flex:none}
.tk span{display:flex;flex-direction:column;min-width:0}
.tk b{font-size:14px}
.tk small{font-size:12px;color:var(--muted)}
.tk em{font-style:normal;font-weight:700;color:var(--brick);margin-right:6px}
.add summary{cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--teal2);min-height:44px;list-style:none}
.add summary::-webkit-details-marker{display:none}
.add summary svg{width:18px;height:18px}
.add[open] summary{margin-bottom:6px}
.card>.add{border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.fm{display:flex;flex-direction:column;gap:10px}
.fm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fm input:not([type=checkbox]),.fm select,.addi input{font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fm label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px;padding-top:20px}
.fm label.cb input{width:20px;height:20px;accent-color:var(--teal2)}
.addi{display:flex;gap:6px;margin-top:6px}
.addi input{flex:1;min-width:0}
.mine{display:inline-block;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;text-decoration:none}
.del{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 10px;min-height:32px;cursor:pointer;flex:none}
.del.sure{border-color:var(--brick);color:#fff;background:var(--brick)}
.ckrow{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line)}
.ckrow:last-child{border-bottom:0}
.ckrow .del{opacity:.75}
.ckrow label{flex:1;border-bottom:0!important}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pv{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.pv .late{color:var(--brick)}
.leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--teal2);margin-bottom:2px}
.leg svg{width:14px;height:14px}
.shf{display:inline-block;font-size:11px;font-weight:700;color:var(--brick);background:var(--brick-soft);border-radius:6px;padding:0 6px;margin-left:6px}
.wl li.route .wt{background:var(--teal2);color:var(--on-dark)}
.pickbox{display:flex;flex-direction:column;gap:6px;background:var(--apricot-soft);border-radius:12px;padding:10px}
.pks{display:flex;flex-wrap:wrap;gap:6px}
.pk{font:inherit;display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;min-height:44px;cursor:pointer;max-width:100%}
.pk svg{width:16px;height:16px;flex:none;color:var(--brick)}
.pk.spot svg{color:var(--teal2)}
.pk span{display:flex;flex-direction:column;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
.pk small{font-weight:400;font-size:11.5px;color:var(--muted)}
.pk.on{border-color:var(--teal2);box-shadow:0 0 0 2px var(--teal-soft)}
.pko summary{cursor:pointer;font-size:13px;color:var(--teal2);font-weight:700;min-height:36px;display:flex;align-items:center}
.books{display:flex;flex-wrap:wrap;gap:6px}
.bk{font:inherit;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 14px;min-height:36px;border:1.5px solid;line-height:1.3}
.bk span{font-weight:400;color:var(--ink)}
.bk.ok{color:var(--teal2);border-color:var(--teal-soft);background:var(--teal-soft)}
.bk.todo{color:var(--brick);border-color:var(--apricot);background:var(--apricot-soft);border-style:dashed;cursor:pointer}
button.bk.ok{cursor:pointer}
.lodge{font-size:14px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.lodge b{color:var(--brick)}
.wx{display:flex;flex-direction:column;gap:8px;background:linear-gradient(var(--teal-soft),var(--surface) 70%)}
.wxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.wxi{display:flex;flex-direction:column}
.wxp{font-size:13px;font-weight:700;color:var(--teal)}
.wxt{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.wxt b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink)}
.wxa{margin:0;font-size:14px}
.fl{display:flex;flex-direction:column;gap:10px;background:linear-gradient(var(--brick-soft),var(--surface) 80%)}
.flr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start}
.flr>div{display:flex;flex-direction:column;min-width:0}
.flt{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.flc{font-size:13px;font-weight:700;color:var(--brick);letter-spacing:.06em}
.flm{align-items:center;padding-top:10px}

/* 動畫 */
.art g[class]{transform-box:fill-box;transform-origin:center}
.art .drift{animation:drift 9s ease-in-out infinite alternate}
.art .fly{animation:fly 6s ease-in-out infinite}
.art .bob{animation:bob 3.4s ease-in-out infinite}
.art .sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
.art .steam{animation:steam 2.8s ease-in-out infinite;transform-origin:50% 100%}
.art .puff{animation:puff 3.6s ease-in-out infinite}
.art .nod{animation:nod 4s ease-in-out infinite;transform-origin:30% 100%}
.art .glide{animation:glide 8s ease-in-out infinite alternate}
.art .swing{animation:sway 3s ease-in-out infinite;transform-origin:50% 0}
.art .pulse{animation:pulse 2.4s ease-in-out infinite}
.art .spin{animation:spin 30s linear infinite}
.art .fall{animation:fall 1.2s linear infinite}
.art .d1{animation-delay:-1.2s}.art .d2{animation-delay:-2.1s}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(10px)}}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-6px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes steam{0%{opacity:.25;transform:translateY(4px) scaleY(.85)}50%{opacity:1}100%{opacity:.2;transform:translateY(-6px) scaleY(1.1)}}
@keyframes puff{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.12)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes glide{from{transform:translate(0,0)}to{transform:translate(78px,-46px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{to{stroke-dashoffset:-12}}
.bounce{animation:bounceIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bounceIn{0%{transform:translateY(14px) scale(.97);opacity:.35}60%{transform:translateY(-5px) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.art *,.bounce{animation:none!important}.btn:active{transform:none}}

    let j=-1;for(const f of ok){j=day.stops.findIndex((s,i)=>i>last&&i>0&&f(s));if(j>=0)break}
    if(j<0||out[j]){rest.push(l);return}out[j]=l;last=j});return{out,rest}}

/* ---------- 登機證・入境 QR Code（存在這支手機的 IndexedDB） ---------- */
const QDB={p:null,open(){if(!this.p)this.p=new Promise((ok,no)=>{const r=indexedDB.open("ky9",1);r.onupgradeneeded=()=>r.result.createObjectStore("qr",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return this.p},
  async tx(mode,fn){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction("qr",mode),st=t.objectStore("qr"),r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})},
  all(){return this.tx("readonly",s=>s.getAll())},put(v){return this.tx("readwrite",s=>s.put(v))},del(id){return this.tx("readwrite",s=>s.delete(id))}};
const QTYPES=["登機證","入境審查","海關申報","入境＋海關","其他"];
let qrList=null,qrUrls={},qrAdd=null,qrType="登機證",qrWho="",qrView=null;
async function qrLoad(){try{qrList=(await QDB.all()).sort((a,b)=>a.ts-b.ts);qrList.forEach(q=>{if(!qrUrls[q.id])qrUrls[q.id]=URL.createObjectURL(q.blob)})}catch(e){qrList=[]}}
function qrBoxHTML(d){const L=(qrList||[]).filter(q=>q.f===d),open=qrAdd===d;
  return`<div class="qrhd"><b>${ic("qr")}登機證・QR Code</b><button type="button" class="btn sm" data-qradd="${d}">${open?"取消":`${ic("plus")}新增`}</button></div>
   ${L.length?`<div class="qrgrid">${L.map(q=>`<button type="button" class="qrth" data-qrv="${q.id}"><img src="${qrUrls[q.id]}" alt="${esc(q.t)}"><span>${esc(q.t)}${q.w?"・"+esc(q.w):""}</span></button>`).join("")}</div>`:(open?"":`<p class="sub qre">${d===DAYS[0].d?"把 Visit Japan Web 的入境、海關 QR Code 截圖，或登機證拍照存在這裡，入境時點開就能出示。":"把回程登機證拍照或截圖存在這裡。"}</p>`)}
   ${open?`<div class="qradd"><div class="chips">${QTYPES.map(t=>`<button type="button" class="chip" data-qrt="${t}" aria-pressed="${qrType===t}">${t}</button>`).join("")}</div>
     <input id="qrwho" type="text" placeholder="誰的？（例如：爸爸、寶寶，可不填）" value="${esc(qrWho)}" autocomplete="off">
     <div class="trbtns2"><label class="btn p">${ic("camera")}拍照<input type="file" accept="image/*" capture="environment" data-qrf="${d}" hidden></label><label class="btn">${ic("photo")}選截圖<input type="file" accept="image/*" data-qrf="${d}" hidden></label></div></div>`:""}`}
function qrPaint(){const boxes=app.querySelectorAll("[data-qrs]");if(!boxes.length)return;
  if(qrList===null){qrLoad().then(qrPaint);boxes.forEach(b=>b.innerHTML=qrBoxHTML(b.dataset.qrs));return}
  boxes.forEach(b=>b.innerHTML=qrBoxHTML(b.dataset.qrs))}
async function qrSave(file,d){try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
  const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.92));const q={id:Date.now().toString(36),f:d,t:qrType,w:(document.getElementById("qrwho")||{}).value?.trim()||"",ts:Date.now(),blob};
  await QDB.put(q);qrUrls[q.id]=URL.createObjectURL(blob);qrList.push(q);qrAdd=null;qrWho="";
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  toast("已存好："+q.t);qrPaint()}catch(e){toast("存檔失敗，請再試一次")}}
function qrOpen(id){const L=qrList||[];const i=L.findIndex(q=>q.id===id);if(i<0)return;qrView={i,del:false};qrShow()}
function qrShow(){let ov=document.getElementById("qrv");const L=qrList||[];if(!qrView||!L.length){if(ov)ov.remove();qrView=null;document.body.style.overflow="";return}
  const q=L[qrView.i],sameF=L.filter(x=>x.f===q.f),pos=sameF.indexOf(q);
  if(!ov){ov=document.createElement("div");ov.id="qrv";ov.className="qrv";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");document.body.appendChild(ov);document.body.style.overflow="hidden"}
  ov.innerHTML=`<div class="qrvt"><b>${esc(q.t)}${q.w?"・"+esc(q.w):""}</b><span>${pos+1} / ${sameF.length}</span><button type="button" class="qrx" data-qrclose aria-label="關閉">×</button></div>
   <div class="qrvi"><img src="${qrUrls[q.id]}" alt="${esc(q.t)}"></div>
   <p class="qrvh">把螢幕亮度調到最亮，對準掃描機</p>
   <div class="qrvb"><button type="button" class="btn" data-qrnav="-1"${pos===0?" disabled":""}>‹ 上一張</button><button type="button" class="btn ${qrView.del?"p":""}" data-qrdel>${qrView.del?"確定刪除？":"刪除"}</button><button type="button" class="btn" data-qrnav="1"${pos===sameF.length-1?" disabled":""}>下一張 ›</button></div>`}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-qradd],[data-qrt],[data-qrv],[data-qrclose],[data-qrnav],[data-qrdel]");if(!t)return;
  if(t.dataset.qradd){qrAdd=qrAdd===t.dataset.qradd?null:t.dataset.qradd;qrPaint();return}
  if(t.dataset.qrt){qrType=t.dataset.qrt;const w=document.getElementById("qrwho");if(w)qrWho=w.value;qrPaint();return}
  if(t.dataset.qrv){qrOpen(t.dataset.qrv);return}
  if(t.hasAttribute("data-qrclose")){qrView=null;qrShow();return}
  if(t.dataset.qrnav){const L=qrList,q=L[qrView.i],same=L.filter(x=>x.f===q.f),pos=same.indexOf(q),n=same[pos+ +t.dataset.qrnav];if(n){qrView={i:L.indexOf(n),del:false};qrShow()}return}
  if(t.hasAttribute("data-qrdel")){if(!qrView.del){qrView.del=true;qrShow();return}const q=qrList[qrView.i];await QDB.del(q.id);URL.revokeObjectURL(qrUrls[q.id]);delete qrUrls[q.id];qrList.splice(qrView.i,1);qrView=null;qrShow();qrPaint();toast("已刪除")}});
document.addEventListener("change",e=>{const f=e.target.closest&&e.target.closest("[data-qrf]");if(f&&f.files&&f.files[0]){qrSave(f.files[0],f.dataset.qrf);f.value=""}});
document.addEventListener("input",e=>{if(e.target.id==="qrwho")qrWho=e.target.value});

async function loadForecast(){if(WXF&&Date.now()-WXT<3*3600e3)return;
  const ks=Object.keys(CL_GEO);const url="https://api.open-meteo.com/v1/forecast?latitude="+ks.map(k=>CL_GEO[k][0]).join(",")+"&longitude="+ks.map(k=>CL_GEO[k][1]).join(",")+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16";
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(tm);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
    const d={};ks.forEach((k,i)=>{const D=j[i]&&j[i].daily;if(!D)return;d[k]={};D.time.forEach((t,n)=>{d[k][t]={hi:D.temperature_2m_max[n],lo:D.temperature_2m_min[n],pp:D.precipitation_probability_max[n],code:D.weather_code[n]}})});
    WXF=d;WXT=Date.now();try{localStorage.setItem("ky9-wx",JSON.stringify({t:WXT,d}))}catch(e){}
    const r0=(location.hash||"#today").slice(1);const ae=document.activeElement;if((r0==="today"||r0==="plan")&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))rerender(true)}catch(e){}}
const WMO=c=>c===0?["晴","sun"]:c<=2?["晴時多雲","psun"]:c===3?["陰","cloud"]:c<=48?["起霧","fog"]:c<=57?["毛毛雨","rain"]:c<=67?["雨","rain"]:c<=77?["雪","snow"]:c<=82?["陣雨","rain"]:c<=86?["陣雪","snow"]:["雷雨","storm"];
function wxIcon(k){const S=`stroke="${PAL.k}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"`;
  const sun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${PAL.ya}" ${S}/>`,cl=(x,y)=>`<path d="M${x} ${y+12}q-8 0-8-7t8-7q2-7 10-7t10 7q7 0 7 7t-7 7z" fill="${PAL.w}" ${S}/>`;
  const body={sun:sun(20,20,9),psun:sun(15,14,7)+cl(14,16),cloud:cl(10,12),fog:cl(10,8)+`<path d="M8 32h24M12 37h18" ${S}/>`,rain:cl(10,8)+`<path d="M14 31l-2 5M21 31l-2 5M28 31l-2 5" stroke="${PAL.mi}" stroke-width="3" stroke-linecap="round"/>`,snow:cl(10,8)+`<g fill="${PAL.mi}" ${S}><circle cx="14" cy="34" r="2.5"/><circle cx="22" cy="36" r="2.5"/><circle cx="30" cy="34" r="2.5"/></g>`,storm:cl(10,8)+`<path d="M22 28l-5 7h5l-3 6" fill="none" stroke="${PAL.co}" stroke-width="3" stroke-linejoin="round"/>`}[k];
  return`<svg class="wxic" viewBox="0 0 40 40" aria-hidden="true">${body}</svg>`}
function wxCute(k){const K=PAL.k,S=`stroke="${K}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
  const face=(x,y)=>`<circle cx="${x-5}" cy="${y}" r="1.8" fill="${K}"/><circle cx="${x+5}" cy="${y}" r="1.8" fill="${K}"/><path d="M${x-2.5} ${y+3.2}q2.5 2.4 5 0" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="${x-8.5}" cy="${y+3}" rx="2.2" ry="1.4" fill="${PAL.co}" opacity=".8"/><ellipse cx="${x+8.5}" cy="${y+3}" rx="2.2" ry="1.4" fill="${PAL.co}" opacity=".8"/>`;
  const cloud=(dy)=>`<path d="M12 ${30+dy}q-8 0-8-8t9-8q2-9 12-9t12 9q9 0 9 8.5t-9 7.5z" fill="${PAL.w}" ${S}/>`+face(25,21+dy);
  const sunB=(x,y,r)=>`<g ${S}>${[0,45,90,135,180,225,270,315].map(a=>{const t=a*Math.PI/180;return`<path d="M${(x+Math.cos(t)*(r+3)).toFixed(1)} ${(y+Math.sin(t)*(r+3)).toFixed(1)}L${(x+Math.cos(t)*(r+7)).toFixed(1)} ${(y+Math.sin(t)*(r+7)).toFixed(1)}"/>`}).join("")}</g><circle cx="${x}" cy="${y}" r="${r}" fill="${PAL.ya}" ${S}/>`;
  const drop=(x,y)=>`<path d="M${x} ${y}q-3 4-3 6a3 3 0 0 0 6 0q0-2-3-6z" fill="${PAL.mi}" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/>`;
  const body={sun:sunB(24,24,11)+face(24,24),psun:sunB(15,14,7)+cloud(6),cloud:cloud(4),fog:cloud(0)+`<path d="M9 39h30M14 44h20" ${S} fill="none"/>`,
    rain:cloud(0)+drop(16,35)+drop(25,37)+drop(34,35),snow:cloud(0)+`<g fill="${PAL.w}" ${S}><circle cx="16" cy="38" r="2.6"/><circle cx="25" cy="41" r="2.6"/><circle cx="34" cy="38" r="2.6"/></g>`,
    storm:cloud(0)+`<path d="M26 32l-5 7h5l-3 7" fill="none" stroke="${PAL.co}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`}[k]||cloud(4);
  return`<svg class="wxcute" viewBox="0 0 48 48" aria-hidden="true">${body}</svg>`}
function clAdvice(lo){return lo<=0?"清晨會到零度以下，路面可能結冰；羽絨外套、手套、毛帽必帶，寶寶要包好":lo<=4?"早晚很冷，白天十度出頭；發熱衣＋羽絨外套，洋蔥式穿法":"白天十幾度，早晚涼；發熱衣＋外套就夠"}
function weatherHTML(day){const ks=DAY_CL[day.d]||[];if(!ks.length)return"";
  const fx=ks.map(k=>WXF&&WXF[k]&&WXF[k][day.d]).filter(Boolean),live=fx.length===ks.length;
  const lo=live?Math.min(...fx.map(f=>f.lo)):Math.min(...ks.map(k=>CL[k][2]));
  const extra=live?[fx.some(f=>(f.code>=71&&f.code<=77)||f.code===85||f.code===86)?"可能下雪，山路要準備雪鏈":"",Math.max(...fx.map(f=>f.pp||0))>=50?"降雨機率高，記得帶傘、推車雨罩":""].filter(Boolean):[];
  const upd=WXT?new Date(WXT+9*3600e3).toISOString().slice(11,16):"";
  const sum=ks.map((k,i)=>{const c=CL[k];if(live){const f=fx[i],w=WMO(f.code);return`<span class="wxc"><span class="wxcity">${c[0].replace("・","<br>")}</span>${wxCute(w[1])}<span class="wxct"><b>${w[0]}<span>${Math.round(f.lo)}° / ${Math.round(f.hi)}°</span></b><small>降雨機率 ${f.pp==null?"—":f.pp+"%"}</small></span></span>`}
    return`<span class="wxc"><span class="wxcity">${c[0].replace("・","<br>")}</span>${wxCute(c[3]>=80?"cloud":"psun")}<span class="wxct"><b>平均<span>${c[2].toFixed(0)}° / ${c[1].toFixed(0)}°</span></b><small>月雨量約 ${c[3].toFixed(0)} mm</small></span></span>`}).join("");
  return`<details class="card wx wxd" data-wx="${day.d}"${wxOpen.has(day.d)?" open":""}><summary><span class="wxsum"><span class="label">${live?"天氣":"12 月平均天氣"}・${md(day.d)}（${day.w}）${extra.length?' <span class="wxw">注意</span>':""}</span><span class="wxcs">${sum}</span></span><span class="chev" aria-hidden="true"></span></summary>
   <p class="wxa">${clAdvice(lo)}${extra.length?"。"+extra.join("；"):""}</p>
   <div class="row">${ks.map(k=>`<a class="btn" href="https://www.google.com/search?q=${encodeURIComponent(CL[k][4])}" target="_blank" rel="noopener">${ic("sun")}${CL[k][0]}詳細預報</a>`).join("")}</div>
</details>`}
